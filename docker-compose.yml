version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: kilogram-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: kilogram
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kilogram-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/kilogram?schema=public
      - JWT_SECRET=super-secret-key-change-in-production
      - JWT_REFRESH_SECRET=super-refresh-secret-key-change-in-production
      - FRONTEND_URL=http://localhost:3000
      - CLOUDINARY_CLOUD_NAME=mock
      - CLOUDINARY_API_KEY=mock
      - CLOUDINARY_API_SECRET=mock
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kilogram-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NEXT_PUBLIC_API_URL=http://localhost:5000/api
      - NEXT_PUBLIC_SOCKET_URL=http://localhost:5000
    depends_on:
      - backend

volumes:
  postgres_data:
